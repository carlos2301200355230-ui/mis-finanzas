<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f2ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Mis Finanzas</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
<style>
:root{--bg:#f5f2ec;--card:#fff;--ink:#1f2a37;--muted:#6b7280;--line:#ebe5dc;--soft:#f8f6f2;--pri:#0f766e;--pri-bg:#e6f4f1;--in:#059669;--in-bg:#e7f6ef;--out:#dc2626;--out-bg:#fdecec;--gold:#a16207;--gold-bg:#fdf6e3;--gold-line:#f1dfb0;--debt:#7c3aed;--debt-bg:#f1ebfe;--warn:#d97706;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(31,42,55,.06);--r:18px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1318;--card:#171e27;--ink:#e6edf3;--muted:#94a3b8;--line:#263140;--soft:#1c2530;--pri:#2dd4bf;--pri-bg:#123a37;--in:#34d399;--in-bg:#123328;--out:#f87171;--out-bg:#3a1a1a;--gold:#f6c453;--gold-bg:#2a2414;--gold-line:#4a3d1c;--debt:#a78bfa;--debt-bg:#2a2140;--warn:#fbbf24;--shadow:0 1px 2px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2}
.hidden{display:none!important}
.app{display:flex;min-height:100vh}
.side{width:244px;flex:none;background:var(--card);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 14px;font-weight:700;font-size:18px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#0f766e,#14b8a6);display:grid;place-items:center;font-size:20px}
.side .grp{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;padding:14px 12px 4px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;border:0;background:none;cursor:pointer;text-align:left;color:var(--muted);font-weight:600;width:100%}
.nav:hover{background:var(--soft);color:var(--ink)}
.nav.on{background:var(--pri-bg);color:var(--pri)}
.nav .ic{font-size:18px;width:24px;text-align:center}
.side .grow{flex:1;min-height:10px}
main{flex:1;min-width:0;padding:28px 32px 110px;max-width:1200px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:26px}
.top .sub{color:var(--muted);margin-top:4px}
.bottom{display:none}
.mobile-only{display:none}
@media (max-width:820px){
 .hide-sm{display:none}
 input,select,textarea{font-size:16px}
 main{padding-top:calc(18px + env(safe-area-inset-top))!important}
 .modal{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
 .side{display:none}
 .mobile-only{display:inline-flex}
 main{padding:18px 16px 110px}
 .top h1{font-size:22px}
 .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:20;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bottom .nav{flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center;justify-content:center}
 .bottom .nav .ic{font-size:20px}
}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:820px){.g3,.g2{grid-template-columns:1fr}}
@media (max-width:420px){.g4{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{font-size:16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stat .lbl{color:var(--muted);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.stat .val{font-size:24px;font-weight:700;margin-top:6px;letter-spacing:-.3px;word-break:break-word}
.stat .foot{font-size:12.5px;color:var(--muted);margin-top:4px}
@media (max-width:420px){.stat{padding:14px}.stat .val{font-size:18px}}
.c-in{color:var(--in)}.c-out{color:var(--out)}.c-gold{color:var(--gold)}.c-debt{color:var(--debt)}.c-pri{color:var(--pri)}.muted{color:var(--muted)}.c-warn{color:var(--warn)}
.dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-size:15px}
.mt{margin-top:16px}.mt2{margin-top:24px}
.sm-t{font-size:13px}
.btn{border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--soft);border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn:disabled{opacity:.6;cursor:default}
.btn.pri{background:var(--pri);color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){.btn.pri{color:#06201d}}
.btn.gold{background:#d4a017;color:#2b1d00;border-color:transparent}
.btn.danger{background:var(--out-bg);color:var(--out);border-color:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.ghost{background:none;border-color:transparent}
.icon-btn{border:0;background:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--muted);font-size:15px}
.icon-btn:hover{background:var(--soft);color:var(--ink)}
.fab{position:fixed;right:24px;bottom:24px;width:60px;height:60px;border-radius:20px;border:0;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;font-size:30px;cursor:pointer;box-shadow:0 10px 25px rgba(15,118,110,.4);z-index:25}
@media (max-width:820px){.fab{bottom:84px;right:16px;width:54px;height:54px}}
.month{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.month b{min-width:140px;text-align:center;font-size:15px}
.month button{border:0;background:none;cursor:pointer;font-size:18px;width:34px;height:34px;border-radius:10px;color:var(--muted)}
.month button:hover{background:var(--soft)}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .ico{width:40px;height:40px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:19px;flex:none}
.row .info{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.row .acts{display:flex;gap:2px}
@media (max-width:520px){.row .acts .icon-btn{padding:4px}}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .big{font-size:38px;margin-bottom:6px}
.day{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:14px 4px 4px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--pri)}
.stack{display:flex;height:22px;border-radius:99px;overflow:hidden;border:1px solid var(--line);background:var(--soft)}
.stack i{display:block;height:100%}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.in{background:var(--in-bg);color:var(--in)}.pill.out{background:var(--out-bg);color:var(--out)}.pill.gold{background:var(--gold-bg);color:var(--gold)}.pill.debt{background:var(--debt-bg);color:var(--debt)}.pill.warn{background:var(--gold-bg);color:var(--warn)}.pill.pri{background:var(--pri-bg);color:var(--pri)}
.hero{background:linear-gradient(135deg,var(--gold-bg),var(--card));border:1px solid var(--gold-line);border-radius:var(--r);padding:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero .verse{font-style:italic;color:var(--muted);max-width:620px;margin-top:10px}
.hero .big{font-size:34px;font-weight:800;color:var(--gold);margin-top:4px}
.hero:after{content:"✝";position:absolute;right:24px;top:6px;font-size:110px;opacity:.07}
.tabs{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;white-space:nowrap}
.tbl tfoot td{font-weight:800;border-bottom:0}
.scroll{overflow-x:auto}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.f label{font-size:13px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--soft);outline:none}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--pri);background:var(--card)}
.f .money{font-size:22px;font-weight:700}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.frow{grid-template-columns:1fr}}
.check{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--pri);flex:none}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);padding:5px;border-radius:14px;margin-bottom:16px;border:1px solid var(--line)}
.seg button{border:0;padding:10px;border-radius:10px;background:none;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on.in{background:var(--in);color:#fff}.seg button.on.out{background:var(--out);color:#fff}.seg button.on.debt{background:var(--debt);color:#fff}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar input,.toolbar select{padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;backdrop-filter:blur(3px)}
.modal{background:var(--card);border-radius:22px;width:100%;max-width:480px;max-height:92vh;overflow:auto;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .18s ease}
.modal.wide{max-width:720px}
.modal h2{font-size:20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.96);opacity:0}}
@media (max-width:520px){.modal-bg{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;max-height:94vh}}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#1f2a37;color:#fff;padding:12px 20px;border-radius:14px;z-index:60;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .2s;max-width:90vw;text-align:center}
.toast.err{background:#b91c1c}
@media (max-width:820px){.toast{bottom:90px}}
.lock{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,rgba(20,184,166,.18),transparent 45%),radial-gradient(circle at 90% 90%,rgba(212,160,23,.15),transparent 40%),var(--bg)}
.lock .box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:var(--shadow)}
.lock .logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#0f766e,#14b8a6);display:grid;place-items:center;font-size:32px;margin:0 auto 14px}
.lock h1{text-align:center;font-size:24px}
.lock p{text-align:center;color:var(--muted);margin:6px 0 22px}
.lock .btn{width:100%;justify-content:center;padding:13px}
.lock .err{color:var(--out);font-size:13.5px;min-height:20px;margin-bottom:8px;text-align:center}
.link{background:none;border:0;color:var(--pri);cursor:pointer;font-weight:600;text-decoration:underline;padding:0}
.banner{display:flex;gap:12px;align-items:center;background:var(--gold-bg);border:1px solid var(--gold-line);border-radius:14px;padding:12px 16px;margin-bottom:18px;flex-wrap:wrap}
.banner .grow{flex:1;min-width:200px}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{flex:1;min-width:180px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bars .pair i{width:42%;max-width:22px;border-radius:6px 6px 2px 2px;min-height:2px}
.bars small{font-size:11.5px;color:var(--muted);font-weight:600}
.keys{display:flex;gap:14px;font-size:12.5px;color:var(--muted);font-weight:600}
.keys i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.debt-card .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.debt-card .saldo{font-size:22px;font-weight:800}
.hist{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px;font-size:13.5px}
.hist div{display:flex;justify-content:space-between;padding:4px 0;gap:8px}
.ring{width:84px;height:84px;flex:none}
.cats-edit .row{padding:8px 4px}
.cats-edit input{padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--soft);width:100%}
/* avisos */
.aviso{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:var(--soft);margin-bottom:8px;border-left:4px solid var(--line)}
.aviso.out{border-left-color:var(--out)}.aviso.warn{border-left-color:var(--warn)}.aviso.gold{border-left-color:#d4a017}.aviso.pri{border-left-color:var(--pri)}
.aviso .tx{flex:1;font-size:14px;min-width:0}
.aviso .ic{font-size:20px}
/* rachas */
.streaks{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.streaks button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-weight:600;font-size:13.5px;cursor:pointer;box-shadow:var(--shadow)}
/* calendario */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:12px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase}
.cal .d{min-height:96px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--card);cursor:pointer;display:flex;flex-direction:column;gap:2px;font-size:12px;min-width:0;text-align:left}
.cal .d:hover{border-color:var(--pri)}
.cal .d.x{background:none;border:0;cursor:default}
.cal .d.today{border:2px solid var(--pri)}
.cal .d .n{font-weight:700;font-size:13px;display:flex;justify-content:space-between}
.cal .d .v{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:620px){.cal{gap:3px}.cal .d{min-height:62px;padding:4px;font-size:10px;border-radius:8px}.cal .d .n{font-size:11px}}
/* mas */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--pri)}
.tile .ti{font-size:26px;width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;flex:none}
.tile b{display:block}
.tile span{font-size:12.5px;color:var(--muted)}
/* logros */
.badge{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--card)}
.badge .bi{font-size:30px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--gold-bg);flex:none}
.badge.off{opacity:.5}.badge.off .bi{filter:grayscale(1);background:var(--soft)}
/* compras */
.item{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line)}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item .nm{flex:1;min-width:0;font-weight:600}
.item input[type=checkbox]{width:22px;height:22px;accent-color:var(--pri);flex:none}
.item input.pr{width:110px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--soft);text-align:right}
.thumb{max-width:100%;max-height:180px;border-radius:12px;display:block;margin-bottom:8px}
.photo-full{max-width:100%;border-radius:12px;display:block;margin:auto}
/* impresión */
#print{display:none}
@media print{
 body.printing #root,body.printing .modal-bg,body.printing .toast{display:none!important}
 body.printing #print{display:block}
 html,body{background:#fff!important;color:#111!important}
}
#print{font:12px/1.4 "Segoe UI",Arial,sans-serif;color:#111}
#print h1{font-size:22px;margin:0}#print h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #0f766e;padding-bottom:3px;color:#0f766e}
#print table{width:100%;border-collapse:collapse}#print td,#print th{padding:4px 6px;border-bottom:1px solid #ddd;text-align:left}#print .n{text-align:right;white-space:nowrap}
#print .sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}#print .sum div{border:1px solid #ddd;border-radius:8px;padding:8px}#print .sum b{display:block;font-size:15px}
#print .two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
</style>
</head>
<body>
<div id="root"></div>
<div id="print"></div>
<input type="file" id="fileIn" accept=".json,application/json" class="hidden">
<script>
"use strict";
/* ========= utilidades ========= */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n)<0?'- ':'')+'$ '+Math.round(Math.abs(n||0)).toLocaleString('es-CO');
const fmtK=n=>{n=Math.round(n);const a=Math.abs(n);return a>=1e6?(n/1e6).toFixed(1).replace('.0','').replace('.',',')+'M':a>=1e3?Math.round(n/1e3)+'k':String(n)};
const num=v=>Number(String(v||'').replace(/[^\d]/g,''))||0;
const miles=n=>n?num(n).toLocaleString('es-CO'):'';
const pad=n=>String(n).padStart(2,'0');
const isoDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy=()=>isoDate(new Date());
const mesDe=f=>String(f||'').slice(0,7);
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const nomMes=m=>{const[y,mm]=m.split('-');return MESES[+mm-1]+' '+y};
const corto=m=>MESES[+m.split('-')[1]-1].slice(0,3);

 catsGasto:[{n:'Vivienda / arriendo',i:'🏠',lim:0},{n:'Mercado y comida',i:'🛒',lim:0},{n:'Transporte',i:'🚌',lim:0},{n:'Servicios públicos',i:'💡',lim:0},{n:'Celular e internet',i:'📱',lim:0},{n:'Salud',i:'🩺',lim:0},{n:'Educación',i:'🎓',lim:0},{n:'Ropa y cuidado',i:'👕',lim:0},{n:'Familia',i:'👨‍👩‍👧',lim:0},{n:'Salidas y diversión',i:'🎉',lim:0},{n:'Otros gastos',i:'🧾',lim:0}],
 catsIngreso:[{n:'Salario',i:'💼'},{n:'Trabajos extra',i:'🛠️'},{n:'Ventas / negocio',i:'🏷️'},{n:'Regalos',i:'🎁'},{n:'Otros ingresos',i:'💰'}]},

function normalizar(d){
 const b=nuevoEstado();d.cfg=Object.assign({},b.cfg,d.cfg||{});
 COLS.concat(['borrados']).forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});
 if(!d.cuentas.length)d.cuentas=CUENTAS_DEF.map(c=>({...c}));
 const MAP={'Efectivo':'c_efectivo','Nequi':'c_nequi','Banco / transferencia':'c_banco'};
 const porNombre=n=>{const id=MAP[n]||'c_'+n.toLowerCase().replace(/[^a-z]/g,'');if(!d.cuentas.some(c=>c.id===id)){const def=CUENTAS_DEF.find(c=>c.id===id);d.cuentas.push(def?{...def}:{id,n,i:n==='Tarjeta'?'💳':'📱',ini:0})}return id};
 const def=d.cuentas[0].id;
 d.movs.forEach(x=>{if(!x.cuenta)x.cuenta=x.metodo?porNombre(x.metodo):def;delete x.metodo});
 d.ofrendas.forEach(x=>{if(!x.cuenta)x.cuenta=def});
 d.deudas.forEach(x=>{if(!Array.isArray(x.abonos))x.abonos=[];x.abonos.forEach(a=>{if(!a.cuenta)a.cuenta=def})});
 d.metas.forEach(x=>{if(!Array.isArray(x.aportes))x.aportes=[];x.aportes.forEach(a=>{if(!a.cuenta)a.cuenta=def})});
 return d}

/* ========= cifrado ========= */
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function unb64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function derive(pw,sl,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:sl,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function encStr(str,key){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key||cryptoKey,new TextEncoder().encode(str));return{iv:b64(iv),data:b64(ct)}}
async function decStr(env,key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key||cryptoKey,unb64(env.data));return new TextDecoder().decode(pt)}
async function encrypt(obj){return{app:'MisFinanzas',v:2,iter:curIter,salt:b64(salt),...await encStr(JSON.stringify(obj))}}
const decrypt=async(env,key)=>JSON.parse(await decStr(env,key));

/* ========= fotos (IndexedDB, cifradas) ========= */
/* Se guardan en IndexedDB; si el navegador no lo permite, en localStorage (respaldo). */
let dbP;const FK='misFinanzas.foto.';
function idb(){return dbP||(dbP=new Promise((res,rej)=>{let ok=false;const to=setTimeout(()=>{if(!ok)rej(new Error('sin IndexedDB'))},2500);
 try{const r=indexedDB.open('misFinanzasFotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>{ok=true;clearTimeout(to);res(r.result)};r.onerror=()=>{clearTimeout(to);rej(r.error)}}catch(e){clearTimeout(to);rej(e)}}))}
async function idbOp(mode,fn){const db=await idb();return new Promise((res,rej)=>{const tx=db.transaction('f',mode);const r=fn(tx.objectStore('f'));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)})}
async function fotoPut(id,env){try{await idbOp('readwrite',s=>s.put(env,id))}catch(e){try{localStorage.setItem(FK+id,JSON.stringify(env))}catch(e2){throw new Error('No hay espacio para más fotos. Descarga una copia y borra fotos viejas.')}}}
async function fotoGet(id){let v;try{v=await idbOp('readonly',s=>s.get(id))}catch(e){}if(v)return v;const l=localStorage.getItem(FK+id);return l?JSON.parse(l):null}
async function fotoDel(id){if(!id)return;try{await idbOp('readwrite',s=>s.delete(id))}catch(e){}localStorage.removeItem(FK+id)}
async function fotoTodas(){const out={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(FK))try{out[k.slice(FK.length)]=JSON.parse(localStorage.getItem(k))}catch(e){}}
 try{const db=await idb();await new Promise((res,rej)=>{const c=db.transaction('f','readonly').objectStore('f').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res()};c.onerror=()=>rej(c.error)})}catch(e){}return out}
async function fotoBorrarTodas(){try{await idbOp('readwrite',s=>s.clear())}catch(e){}Object.keys(localStorage).filter(k=>k.startsWith(FK)).forEach(k=>localStorage.removeItem(k))}
function comprimir(file){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,1200/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);res(c.toDataURL('image/jpeg',.7))};img.onerror=()=>rej(new Error('No se pudo leer la imagen'));img.src=URL.createObjectURL(file)})}

let hashes={},cfgHash='';
const hashOf=x=>{const{u,...r}=x;return JSON.stringify(r)};
const hashCfg=()=>{const{u,ultimaCopia,...r}=S.cfg;return JSON.stringify(r)};
function initHashes(){hashes={};COLS.forEach(k=>S[k].forEach(x=>hashes[x.id]=hashOf(x)));cfgHash=hashCfg()}
function stamp(){const now=Date.now(),vistos=new Set();
 COLS.forEach(k=>S[k].forEach(x=>{vistos.add(x.id);const h=hashOf(x);if(hashes[x.id]!==h){x.u=now;hashes[x.id]=h}}));
 Object.keys(hashes).forEach(id=>{if(!vistos.has(id)){S.borrados.push({id,t:now});delete hashes[id]}});
 const ch=hashCfg();if(ch!==cfgHash){S.cfg.u=now;cfgHash=ch}}
let saving=Promise.resolve();
function save(){stamp();const snap=JSON.parse(JSON.stringify(S));saving=saving.then(async()=>{localStorage.setItem(KEY,JSON.stringify(await encrypt(snap)))}).catch(e=>toast('No se pudo guardar: '+e.message,true));render()}

/* ========= cálculos ========= */
const pct=()=>(+S.cfg.pct||0)/100;
const saldoDeuda=d=>(+d.monto||0)-sum(d.abonos);
const ahorradoMeta=m=>sum(m.aportes);
function tot(filtro){
 const f=filtro||(()=>true);
 const mv=S.movs.filter(x=>f(x.fecha));
 const ing=sum(mv.filter(x=>x.tipo==='ingreso')),gas=sum(mv.filter(x=>x.tipo==='gasto'));
 const base=sum(mv.filter(x=>x.tipo==='ingreso'&&x.diezmo));
 const of=S.ofrendas.filter(x=>f(x.fecha));
 const dDado=sum(of.filter(x=>x.tipo==='Diezmo')),ofr=sum(of.filter(x=>x.tipo!=='Diezmo'));
 let abPag=0,abRec=0;S.deudas.forEach(d=>d.abonos.forEach(a=>{if(f(a.fecha)){if(d.tipo==='debo')abPag+=+a.monto;else abRec+=+a.monto}}));
 let aho=0;S.metas.forEach(m=>m.aportes.forEach(a=>{if(f(a.fecha))aho+=+a.monto}));
 return{ing,gas,base,dDebido:base*pct(),dDado,ofr,abPag,abRec,aho,disp:ing-gas-dDado-ofr-abPag+abRec-aho};
}
const totMes=m=>tot(fe=>mesDe(fe)===m);
function diasHasta(dia){const h=new Date();h.setHours(0,0,0,0);let d=new Date(h.getFullYear(),h.getMonth(),Math.min(dia,diasEnMes(h.getFullYear(),h.getMonth())));if(d<h)d=new Date(h.getFullYear(),h.getMonth()+1,Math.min(dia,diasEnMes(h.getFullYear(),h.getMonth()+1)));return{dias:Math.round((d-h)/864e5),fecha:isoDate(d)}}
function catIcon(tipo,n){const l=tipo==='ingreso'?S.cfg.catsIngreso:S.cfg.catsGasto;return(l.find(c=>c.n===n)||{}).i||(tipo==='ingreso'?'💰':'🧾')}
const cuentaDe=id=>S.cuentas.find(c=>c.id===id)||S.cuentas[0];
const nomCuenta=id=>{const c=cuentaDe(id);return c?c.i+' '+c.n:''};
function selCuenta(idAttr,sel){return`<select id="${idAttr}">${S.cuentas.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.i} ${esc(c.n)}</option>`).join('')}</select>`}
function saldosCuentas(){const s={};S.cuentas.forEach(c=>s[c.id]=+c.ini||0);const def=S.cuentas[0].id;const ad=(id,v)=>{s[id in s?id:def]+=v};
 S.movs.forEach(x=>ad(x.cuenta,x.tipo==='ingreso'?+x.monto:-x.monto));
 S.ofrendas.forEach(x=>ad(x.cuenta,-x.monto));
 S.deudas.forEach(d=>d.abonos.forEach(a=>ad(a.cuenta,d.tipo==='debo'?-a.monto:+a.monto)));
 S.metas.forEach(m=>m.aportes.forEach(a=>ad(a.cuenta,-a.monto)));
 S.transfers.forEach(t=>{ad(t.de,-t.monto);ad(t.a,+t.monto)});return s}
const fechaFijo=(f,m)=>m+'-'+pad(Math.min(+f.dia||1,dimDe(m)));
const fijosPend=m=>S.fijos.filter(f=>f.activo!==false&&(!f.desde||f.desde<=m)&&!S.movs.some(x=>x.fijo===f.id&&mesDe(x.fecha)===m));
const pagadaEnMes=(d,m)=>d.abonos.some(a=>mesDe(a.fecha)===m);
function mesesRango(){const fs=[...S.movs,...S.ofrendas].map(x=>x.fecha).filter(Boolean).sort();if(!fs.length)return[];const out=[];let m=mesDe(fs[0]);const fin=mesDe(hoy());while(m<=fin&&out.length<240){out.push(m);m=addMes(m,1)}return out}
function rachaActual(pred){const ms=mesesRango();let r=0;for(let i=ms.length-1;i>=0;i--){if(pred(totMes(ms[i]),ms[i]))r++;else if(i===ms.length-1)continue;else break}return r}
function rachaMax(pred){let r=0,mx=0;mesesRango().forEach(m=>{if(pred(totMes(m),m)){r++;mx=Math.max(mx,r)}else r=0});return mx}

function avisos(){
 const A=[],h=hoy(),mh=mesDe(h),dHoy=+h.slice(8,10),dim=dimDe(mh);
 S.deudas.filter(d=>d.tipo==='debo'&&saldoDeuda(d)>0&&d.dia).forEach(d=>{
  const cuota=Math.min(+d.cuota||saldoDeuda(d),saldoDeuda(d)),dEste=Math.min(+d.dia,dim);
  if(dHoy>dEste&&!pagadaEnMes(d,mh)&&(d.inicio||'')<=mh+'-'+pad(dEste))A.push({ic:'⚠️',nv:'out',t:`Se pasó el pago de <b>${esc(d.nombre)}</b> (día ${dEste}) · ${fmt(cuota)}`,b:'Registrar pago',a:`formAbono('${d.id}')`});
  else{const p=diasHasta(+d.dia);if(p.dias<=3&&!pagadaEnMes(d,mesDe(p.fecha)))A.push({ic:'💳',nv:p.dias<=1?'out':'warn',t:`${p.dias===0?'Hoy':p.dias===1?'Mañana':'En '+p.dias+' días'} pagas <b>${fmt(cuota)}</b> a ${esc(d.nombre)}`,b:'Registrar pago',a:`formAbono('${d.id}')`})}});
 fijosPend(mh).forEach(f=>{const dd=Math.min(+f.dia||1,dim),diff=dd-dHoy;
  if(f.tipo==='gasto'&&diff<=3)A.push({ic:'🔁',nv:diff<0?'out':'warn',t:diff<0?`<b>${esc(f.nombre)}</b> era para el día ${dd} y no está registrado (${fmt(f.monto)})`:`<b>${esc(f.nombre)}</b> · ${fmt(f.monto)} ${diff===0?'es hoy':diff===1?'es mañana':'en '+diff+' días'}`,b:'Registrar',a:`confirmarFijo('${f.id}')`});
  if(f.tipo==='ingreso'&&diff<=0)A.push({ic:'💼',nv:'pri',t:`¿Ya te llegó <b>${esc(f.nombre)}</b> (${fmt(f.monto)})?`,b:'Sí, registrar',a:`confirmarFijo('${f.id}')`})});
 const all=tot(),pend=all.dDebido-all.dDado;
 if(pend>=1000)A.push({ic:'🙏',nv:'gold',t:`Tienes <b>${fmt(pend)}</b> de diezmo pendiente`,b:'Entregar',a:`formOfrenda(null,${Math.round(pend)})`});
 const porCat={};S.movs.filter(x=>x.tipo==='gasto'&&mesDe(x.fecha)===mh).forEach(x=>porCat[x.cat]=(porCat[x.cat]||0)+ +x.monto);
 S.cfg.catsGasto.filter(c=>+c.lim>0&&(porCat[c.n]||0)>=c.lim*.9).forEach(c=>{const g=porCat[c.n];A.push({ic:'📊',nv:g>c.lim?'out':'warn',t:g>c.lim?`Te pasaste del presupuesto de <b>${esc(c.n)}</b> por ${fmt(g-c.lim)}`:`Ya usaste el ${Math.round(g/c.lim*100)}% del presupuesto de <b>${esc(c.n)}</b>`,b:'Ver',a:`go('inicio')`})});
 S.metas.filter(m=>m.fecha&&m.fecha<h&&ahorradoMeta(m)<m.objetivo).forEach(m=>A.push({ic:'🎯',nv:'warn',t:`La meta <b>${esc(m.nombre)}</b> llegó a su fecha y te faltan ${fmt(m.objetivo-ahorradoMeta(m))}`,b:'Editar',a:`formMeta('${m.id}')`}));
 const hay=S.movs.length+S.ofrendas.length+S.deudas.length+S.metas.length>0;
 const dc=S.cfg.ultimaCopia?Math.floor((Date.now()-new Date(S.cfg.ultimaCopia))/864e5):null;
 if(hay&&(dc===null||dc>=7))A.push({ic:'💾',nv:'gold',t:dc===null?'Aún no has guardado una <b>copia de seguridad</b>':`Tu última copia de seguridad fue hace <b>${dc} días</b>`,b:'Guardar copia',a:'descargarCopia()'});
 return A;
}

 </div>
 ${fp.length?`<div class="card mt"><h3>🔁 Fijos pendientes de ${MESES[+mes.split('-')[1]-1].toLowerCase()} <button class="btn sm pri" onclick="registrarTodosFijos()">Registrar todos (${fp.length})</button></h3><div class="list">${fp.map(f=>`<div class="row"><div class="ico" style="background:${f.tipo==='ingreso'?'var(--in-bg)':'var(--out-bg)'}">${catIcon(f.tipo,f.cat)}</div><div class="info"><div class="t">${esc(f.nombre)}</div><div class="s">Día ${+f.dia||1} · ${esc(f.cat)} · ${nomCuenta(f.cuenta)}</div></div><div class="amt ${f.tipo==='ingreso'?'c-in':'c-out'}">${fmt(f.monto)}</div><button class="btn sm" onclick="confirmarFijo('${f.id}')">Registrar</button></div>`).join('')}</div></div>`:''}
 <div class="grid g3 mt">

   <div style="flex:1"><div class="muted" style="font-size:12.5px;font-weight:600">ME DEBEN</div><div style="font-size:20px;font-weight:800" class="c-in">${fmt(meDebenT)}</div></div></div>

   <button class="btn sm mt" onclick="go('deudas')">Ver deudas</button></div>
  <div class="card"><h3>👛 Mi plata hoy</h3>

   <div class="list" style="margin-top:6px">${S.cuentas.map(c=>`<div style="display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0"><span>${c.i} ${esc(c.n)}</span><b class="${sc[c.id]<0?'c-out':''}">${fmt(sc[c.id])}</b></div>`).join('')}</div>
   <div style="display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-top:1px dashed var(--line);margin-top:4px"><span class="muted">🐷 Apartado en metas</span><b class="c-pri">${fmt(sum(S.metas,ahorradoMeta))}</b></div>

 <div class="grid g2 mt">
  <div class="card"><h3>¿En qué se fue la plata?</h3>${cats.length?donut(cats,t.gas):'<div class="empty"><div class="big">🧾</div>No hay gastos este mes</div>'}</div>
  <div class="card"><h3>Últimos 6 meses <span class="keys"><span><i style="background:var(--in)"></i>Ingresos</span><span><i style="background:var(--out)"></i>Gastos</span></span></h3>${barras([-5,-4,-3,-2,-1,0].map(k=>addMes(mes,k)))}</div>

 <div class="card mt"><h3>Movimientos recientes <button class="btn sm ghost" onclick="go('movimientos')">Ver todos →</button></h3>
  ${ult.length?`<div class="list">${ult.map(rowMov).join('')}</div>`:`<div class="empty"><div class="big">✨</div>Empieza registrando lo que ganas y lo que gastas con el botón <b>+</b></div>`}</div>`;

function donut(cats,total){
 const R=60,C=2*Math.PI*R;let off=0;
 const top=cats.slice(0,7);if(cats.length>7)top.push(['Otras',sum(cats.slice(7),x=>x[1])]);
 const segs=top.map(([n,v],i)=>{const l=v/total*C;const s=`<circle r="${R}" cx="80" cy="80" fill="none" stroke="${COLORS[i%COLORS.length]}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;off+=l;return s}).join('');
 return`<div class="donut-wrap"><svg width="160" height="160" viewBox="0 0 160 160"><circle r="${R}" cx="80" cy="80" fill="none" stroke="var(--soft)" stroke-width="22"/>${segs}<text x="80" y="76" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">Total</text><text x="80" y="95" text-anchor="middle" font-size="14" font-weight="800" fill="var(--ink)">${fmt(total).replace('$ ','$')}</text></svg>
 <div class="legend">${top.map(([n,v],i)=>`<div><i style="background:${COLORS[i%COLORS.length]}"></i><span>${n==='Otras'?'':catIcon('gasto',n)+' '}${esc(n)}</span><b>${fmt(v)}</b><span class="muted" style="flex:none;width:38px;text-align:right">${Math.round(v/total*100)}%</span></div>`).join('')}</div></div>`;
}
function barras(ms,sel){
 const d=ms.map(m=>{const t=totMes(m);return{m,i:t.ing,g:t.gas}});
 const mx=Math.max(1,...d.map(x=>Math.max(x.i,x.g)));const cur=sel||mes;
 return`<div class="bars">${d.map(x=>`<div class="col"><div class="pair"><i style="height:${x.i/mx*100}%;background:var(--in)" title="Ingresos ${fmt(x.i)}"></i><i style="height:${x.g/mx*100}%;background:var(--out)" title="Gastos ${fmt(x.g)}"></i></div><small style="${x.m===cur?'color:var(--ink)':''}">${corto(x.m)}</small></div>`).join('')}</div>`;
}

function vMovs(){
 let l=S.movs.filter(x=>mesDe(x.fecha)===mes);const t=totMes(mes);
 if(filtroTipo!=='todos')l=l.filter(x=>x.tipo===filtroTipo);
 if(filtroCat)l=l.filter(x=>x.cat===filtroCat);
 if(filtroCta)l=l.filter(x=>x.cuenta===filtroCta);
 if(buscar){const q=buscar.toLowerCase();l=l.filter(x=>(x.desc+' '+x.cat+' '+nomCuenta(x.cuenta)).toLowerCase().includes(q))}
 l.sort((a,b)=>b.fecha.localeCompare(a.fecha)||(b.creado||0)-(a.creado||0));
 const cats=[...new Set(S.movs.filter(x=>mesDe(x.fecha)===mes).map(x=>x.cat))].sort();

 l.forEach(x=>{if(x.fecha!==dia){dia=x.fecha;const d=new Date(x.fecha+'T12:00');html+=`<div class="day">${d.toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long'})}</div>`}html+=rowMov(x)});
 return header('Movimientos','Todo lo que entra y sale',monthSwitch()+`<button class="btn" onclick="exportCSV()">⬇️ Excel</button>`)+`
 <div class="grid g3" style="margin-bottom:16px">${stat('Ingresos','💵','var(--in-bg)',fmt(t.ing),'c-in','')}${stat('Gastos','🛍️','var(--out-bg)',fmt(t.gas),'c-out','')}${stat('Diferencia','⚖️','var(--pri-bg)',fmt(t.ing-t.gas),t.ing-t.gas<0?'c-out':'c-pri','Ingresos menos gastos')}</div>
 <div class="card"><div class="toolbar">
  <div class="tabs">${[['todos','Todos'],['ingreso','Ingresos'],['gasto','Gastos']].map(([k,n])=>`<button class="${filtroTipo===k?'on':''}" onclick="filtroTipo='${k}';render()">${n}</button>`).join('')}</div>
  <select onchange="filtroCat=this.value;render()"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${c===filtroCat?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <select onchange="filtroCta=this.value;render()"><option value="">Todas las cuentas</option>${S.cuentas.map(c=>`<option value="${c.id}" ${c.id===filtroCta?'selected':''}>${c.i} ${esc(c.n)}</option>`).join('')}</select>
  <input id="q" placeholder="🔍 Buscar..." value="${esc(buscar)}" oninput="buscar=this.value;render();const q=$('#q');q.focus();q.setSelectionRange(q.value.length,q.value.length)" style="flex:1;min-width:150px">
 </div>
 ${l.length?`<div class="list">${html}</div>`:`<div class="empty"><div class="big">📭</div>No hay movimientos ${buscar||filtroCat||filtroCta||filtroTipo!=='todos'?'con ese filtro':'en '+nomMes(mes).toLowerCase()}<br><button class="btn pri mt" onclick="formMov()">+ Registrar</button></div>`}</div>`;
}
let formTipo='gasto',fotoNueva=null,fotoQuitar=false,fotoActual='',presetMov=null;
function formMov(id,preset){
 const x=id?S.movs.find(m=>m.id===id):null;const p=preset||{};presetMov=preset||null;
 formTipo=x?x.tipo:(p.tipo||formTipo);fotoNueva=null;fotoQuitar=false;fotoActual=x&&x.foto||'';
 const fechaDef=p.fecha||(mesDe(hoy())===mes?hoy():mes+'-01');

 modal(`<h2>${x?'Editar movimiento':p.fijo?'Registrar gasto fijo':'Nuevo movimiento'}<button class="icon-btn" onclick="cerrar()">✕</button></h2>
 <form onsubmit="event.preventDefault();guardarMov('${id||''}')">

   ${x?'':`<label class="check"><input type="checkbox" id="mDiezYa"> Ya entregué el diezmo de este ingreso <span id="dzHint" class="c-gold" style="font-weight:700"></span></label>`}

function setTipo(t,cat){formTipo=t;$('#tIn').className=t==='ingreso'?'on in':'';$('#tOut').className=t==='gasto'?'on out':'';
 const l=t==='ingreso'?S.cfg.catsIngreso:S.cfg.catsGasto;const cur=cat||$('#mCat').value;
 $('#mCat').innerHTML=l.map(c=>`<option value="${esc(c.n)}" ${c.n===cur?'selected':''}>${c.i} ${esc(c.n)}</option>`).join('')+(cat&&!l.some(c=>c.n===cat)?`<option selected>${esc(cat)}</option>`:'');
 $('#diezBox').classList.toggle('hidden',t!=='ingreso');diezmoHint()}
function diezmoHint(){const h=$('#dzHint');if(h)h.textContent=num($('#mMonto').value)?'('+fmt(num($('#mMonto').value)*pct())+')':''}
function moneyIn(el){const n=num(el.value);el.value=n?n.toLocaleString('es-CO'):''}
function pintarFoto(){const b=$('#fotoBox');if(!b)return;
 if(fotoNueva)b.innerHTML=`<img class="thumb" src="${fotoNueva}"><button type="button" class="btn sm" onclick="fotoNueva=null;pintarFoto()">Quitar foto</button>`;
 else if(fotoActual&&!fotoQuitar)b.innerHTML=`<div style="display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn sm" onclick="verFoto('${fotoActual}',true)">📎 Ver foto</button><button type="button" class="btn sm" onclick="$('#mFoto').click()">Cambiar</button><button type="button" class="btn sm ghost" onclick="fotoQuitar=true;pintarFoto()">Quitar</button></div>`;
 else b.innerHTML=`<button type="button" class="btn sm" onclick="$('#mFoto').click()">📷 Tomar o elegir foto</button>`}
async function cargarFoto(inp){const f=inp.files[0];if(!f)return;try{fotoNueva=await comprimir(f);pintarFoto()}catch(e){toast(e.message,true)}}
async function verFoto(id,sinCerrar){try{const env=await fotoGet(id);if(!env)throw new Error('No se encontró la foto en este equipo');const src=await decStr(env);
 const bg=document.createElement('div');bg.className='modal-bg';bg.style.zIndex=55;bg.innerHTML=`<div class="modal wide"><h2>📎 Foto del recibo<button class="icon-btn">✕</button></h2><img class="photo-full" src="${src}"></div>`;bg.onclick=e=>{if(e.target===bg||e.target.closest('.icon-btn'))bg.remove()};document.body.appendChild(bg)}catch(e){toast(e.message||'No se pudo abrir la foto',true)}}
async function guardarMov(id){
 const monto=num($('#mMonto').value);if(!monto){toast('Escribe el valor',true);return}
 const btn=$('#mGuardar');btn.disabled=true;
 const d={tipo:formTipo,monto,fecha:$('#mFecha').value,cat:$('#mCat').value,desc:$('#mDesc').value.trim(),cuenta:$('#mCta').value,diezmo:formTipo==='ingreso'&&$('#mDiez').checked};
 try{
  if(fotoNueva){const fid=uid();await fotoPut(fid,await encStr(fotoNueva));if(fotoActual)await fotoDel(fotoActual);d.foto=fid}
  else if(fotoQuitar){await fotoDel(fotoActual);d.foto=''}
 }catch(e){toast('No se pudo guardar la foto: '+e.message,true);btn.disabled=false;return}
 const p=presetMov||{};
 if(id)Object.assign(S.movs.find(m=>m.id===id),d);
 else{const nm={id:uid(),creado:Date.now(),...d};if(p.fijo)nm.fijo=p.fijo;S.movs.push(nm);

 S.deudas.forEach(d=>d.abonos.forEach(a=>{const p=P(a.fecha);if(p){if(d.tipo==='debo')p.out+=+a.monto;else p.in+=+a.monto}}));

const tasa=d=>(parseFloat(String(d.interes||'').replace(',','.'))||0)/100;
function simular(pago,met,ds0){
 const ds=ds0.map(d=>({id:d.id,n:d.nombre,s:saldoDeuda(d),r:tasa(d),c:+d.cuota||0}));
 let m=0,intTot=0;const orden=[];
 while(ds.some(d=>d.s>0.5)&&m<600){m++;
  ds.forEach(d=>{if(d.s>0){const i=d.s*d.r;d.s+=i;intTot+=i}});
  let disp=pago;
  ds.filter(d=>d.s>0).forEach(d=>{const p=Math.min(d.s,d.c||0,disp);d.s-=p;disp-=p});
  const ord=ds.filter(d=>d.s>0).sort(met==='bola'?(a,b)=>a.s-b.s:(a,b)=>b.r-a.r||a.s-b.s);
  for(const d of ord){if(disp<=0)break;const p=Math.min(d.s,disp);d.s-=p;disp-=p}
  ds.forEach(d=>{if(d.s<=0.5&&!d.fin){d.fin=m;orden.push(d)}})}
 return{meses:m,orden,intTot,imposible:ds.some(d=>d.s>0.5)}}

const ICONOS_META=['🎯','🏠','🏍️','🚗','✈️','🎓','💍','🛡️','📱','💻','🎁','🏥','👶','⛪'];
function vMetas(){
 const t_=sum(S.metas,ahorradoMeta);
 return header('Metas de ahorro','Separa plata para lo que sueñas',`<button class="btn pri" onclick="formMeta()">+ Nueva meta</button>`)+`
 <div class="grid g3" style="margin-bottom:16px">${stat('Ahorrado en total','🐷','var(--pri-bg)',fmt(t_),'c-pri',S.metas.length+(S.metas.length===1?' meta':' metas'))}${stat('Ahorrado este mes','📈','var(--in-bg)',fmt(totMes(mesDe(hoy())).aho),'c-in',MESES[new Date().getMonth()])}${stat('Falta para todas','🏁','var(--soft)',fmt(sum(S.metas,m=>Math.max(0,m.objetivo-ahorradoMeta(m)))),'','Suma de lo que falta')}</div>
 ${S.metas.length?`<div class="grid g2">${S.metas.map(cardMeta).join('')}</div>`:`<div class="card"><div class="empty"><div class="big">🐷</div>Crea tu primera meta: un fondo de emergencia, una moto, un viaje...<br><button class="btn pri mt" onclick="formMeta()">+ Nueva meta</button></div></div>`}`;
}
function cardMeta(m){const a=ahorradoMeta(m),p=m.objetivo?Math.min(100,a/m.objetivo*100):0,falta=Math.max(0,m.objetivo-a);
 let porMes='';if(m.fecha&&falta>0){const h=new Date(),f=new Date(m.fecha+'T12:00');const n=(f.getFullYear()-h.getFullYear())*12+f.getMonth()-h.getMonth();porMes=n>0?`Ahorra <b>${fmt(Math.ceil(falta/n))}</b> al mes para lograrlo el ${fFecha(m.fecha)}`:`<span class="c-out">La fecha ya llegó (${fFecha(m.fecha)})</span>`}
 const R=34,C=2*Math.PI*R;
 return`<div class="card"><div style="display:flex;gap:16px;align-items:center">
  <svg class="ring" viewBox="0 0 84 84"><circle cx="42" cy="42" r="${R}" fill="none" stroke="var(--soft)" stroke-width="9"/><circle cx="42" cy="42" r="${R}" fill="none" stroke="${p>=100?'var(--in)':'var(--pri)'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="17">${m.icono||'🎯'}</text></svg>
  <div style="flex:1;min-width:0"><div style="font-weight:700;font-size:16px">${esc(m.nombre)}</div><div style="font-size:22px;font-weight:800" class="c-pri">${fmt(a)}</div><div class="muted" style="font-size:13px">de ${fmt(m.objetivo)} · ${Math.round(p)}%</div></div></div>
  <div style="font-size:13.5px;margin-top:12px">${p>=100?'🎉 <b>¡Meta cumplida!</b>':`Te faltan <b>${fmt(falta)}</b>`}${porMes?'<br><span class="muted">'+porMes+'</span>':''}</div>
  <div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap"><button class="btn sm pri" onclick="formAporte('${m.id}',1)">+ Ahorrar</button><button class="btn sm" onclick="formAporte('${m.id}',-1)">Sacar</button><button class="btn sm ghost" onclick="formMeta('${m.id}')">✏️</button><button class="btn sm ghost" onclick="borrarMeta('${m.id}')">🗑️</button></div></div>`}
let iconoSel='🎯';
function formMeta(id){const x=id?S.metas.find(m=>m.id===id):null;iconoSel=x?x.icono:'🎯';
 modal(`<h2>${x?'Editar meta':'Nueva meta'}<button class="icon-btn" onclick="cerrar()">✕</button></h2>

  <div class="f"><label>¿Para qué ahorras?</label><input id="gNom" required maxlength="60" value="${esc(x?x.nombre:'')}" placeholder="Ej: Fondo de emergencia"></div>
  <div class="frow"><div class="f"><label>¿Cuánto necesitas?</label><input class="money" id="gObj" inputmode="numeric" oninput="moneyIn(this)" placeholder="$ 0" value="${x?miles(x.objetivo):''}" required></div>

 </form>`,()=>$('#gNom').focus())}

 const d={nombre:$('#gNom').value.trim(),objetivo:o,fecha:$('#gFecha').value,icono:iconoSel};
 if(id)Object.assign(S.metas.find(m=>m.id===id),d);else S.metas.push({id:uid(),aportes:[],...d});cerrar();save();toast('Meta guardada 🎯')}
function borrarMeta(id){confirmar('¿Eliminar esta meta?','Lo ahorrado vuelve a contar como disponible.',()=>{S.metas=S.metas.filter(m=>m.id!==id);save()})}
function formAporte(id,sg,montoSug){const m=S.metas.find(x=>x.id===id);
 modal(`<h2>${sg>0?'Ahorrar para':'Sacar de'} ${esc(m.nombre)}<button class="icon-btn" onclick="cerrar()">✕</button></h2>
 <form onsubmit="event.preventDefault();guardarAporte('${id}',${sg})">

  <div class="frow"><div class="f"><label>Fecha</label><input type="date" id="pFecha" value="${hoy()}" required></div><div class="f"><label>${sg>0?'¿De qué cuenta sale?':'¿A qué cuenta vuelve?'}</label>${selCuenta('pCta',S.cuentas[0].id)}</div></div>
  <div class="muted" style="font-size:12.5px;margin-bottom:12px">${sg>0?'Este valor se separa de tu disponible.':'Este valor vuelve a tu disponible.'}</div>
  <div class="acts"><button type="button" class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri">Guardar</button></div>
 </form>`,()=>$('#pMonto').focus())}
function guardarAporte(id,sg){const m=S.metas.find(x=>x.id===id);let v=num($('#pMonto').value);if(!v)return;
 if(sg<0&&v>ahorradoMeta(m)){toast('Solo tienes '+fmt(ahorradoMeta(m))+' en esta meta',true);return}
 m.aportes.push({id:uid(),monto:v*sg,fecha:$('#pFecha').value,cuenta:$('#pCta').value});cerrar();save();toast(sg>0?'¡Bien! Sigue así 💪':'Retiro registrado')}

function vCuentas(){
 const sc=saldosCuentas(),total=sum(S.cuentas,c=>sc[c.id]);
 const tr=S.transfers.filter(t=>mesDe(t.fecha)===mes).sort((a,b)=>b.fecha.localeCompare(a.fecha));
 return header('Mis cuentas','Dónde está tu plata',`<button class="btn" onclick="formTransfer()">🔄 Pasar plata</button><button class="btn pri" onclick="formCuenta()">+ Cuenta</button>`)+`
 <div class="card" style="margin-bottom:16px;background:linear-gradient(135deg,var(--pri-bg),var(--card))"><div class="muted" style="font-weight:700;font-size:13px">TODA TU PLATA</div><div style="font-size:34px;font-weight:800" class="${total<0?'c-out':'c-pri'}">${fmt(total)}</div><div class="muted sm-t">Más ${fmt(sum(S.metas,ahorradoMeta))} apartados en metas de ahorro</div></div>
 <div class="grid g3">${S.cuentas.map(c=>{const n=S.movs.filter(x=>x.cuenta===c.id&&mesDe(x.fecha)===mes).length;return`<div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="dot" style="width:46px;height:46px;font-size:24px;border-radius:14px;background:var(--soft)">${c.i}</div><div style="flex:1;min-width:0"><div style="font-weight:700">${esc(c.n)}</div><div class="muted sm-t">${n} movimientos en ${MESES[+mes.split('-')[1]-1].toLowerCase()}</div></div></div>

 <div class="aviso pri mt"><span class="ic">💡</span><div class="tx sm-t">Usa <b>Cuadrar</b> cuando el saldo de la app no coincida con lo que de verdad tienes (en la billetera o en la app del banco). La app ajusta el saldo inicial para que quede igual.</div></div>
 <div class="card mt"><h3>🔄 Movimientos entre cuentas · ${nomMes(mes).toLowerCase()} ${monthSwitch()}</h3>${tr.length?`<div class="list">${tr.map(t=>`<div class="row"><div class="ico">🔄</div><div class="info"><div class="t">${nomCuenta(t.de)} → ${nomCuenta(t.a)}</div><div class="s">${fFecha(t.fecha)}${t.nota?' · '+esc(t.nota):''}</div></div><div class="amt">${fmt(t.monto)}</div><div class="acts"><button class="icon-btn" onclick="borrarTransfer('${t.id}')">🗑️</button></div></div>`).join('')}</div>`:'<div class="empty" style="padding:16px">Ej: sacaste plata del cajero (Banco → Efectivo) o recargaste Nequi.</div>'}</div>`}
function formCuenta(id){const c=id?S.cuentas.find(x=>x.id===id):null;
 modal(`<h2>${c?'Editar cuenta':'Nueva cuenta'}<button class="icon-btn" onclick="cerrar()">✕</button></h2><form onsubmit="event.preventDefault();guardarCuenta('${id||''}')">
 <div class="frow" style="grid-template-columns:80px 1fr"><div class="f"><label>Ícono</label><input id="kI" value="${c?c.i:'👛'}" maxlength="4" style="text-align:center;font-size:20px"></div><div class="f"><label>Nombre</label><input id="kN" required maxlength="40" value="${esc(c?c.n:'')}" placeholder="Ej: Daviplata, Bancolombia, Tarjeta"></div></div>

 <div class="acts"><button type="button" class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri">Guardar</button></div></form>`,()=>$('#kN').focus())}
function guardarCuenta(id){const d={n:$('#kN').value.trim(),i:$('#kI').value.trim()||'👛'};if(id)Object.assign(S.cuentas.find(c=>c.id===id),d);else S.cuentas.push({id:'c_'+uid(),ini:num($('#kIni').value),...d});cerrar();save();toast('Cuenta guardada')}
function formCuadrar(id){const c=S.cuentas.find(x=>x.id===id),s=saldosCuentas()[id];
 modal(`<h2>⚖️ Cuadrar ${c.i} ${esc(c.n)}<button class="icon-btn" onclick="cerrar()">✕</button></h2><div class="muted" style="margin:-8px 0 16px">La app dice que tienes <b>${fmt(s)}</b></div>
 <form onsubmit="event.preventDefault();cuadrar('${id}')"><div class="f"><label>¿Cuánto tienes de verdad?</label><input class="money" id="qReal" inputmode="numeric" oninput="moneyIn(this)" value="${s>0?miles(s):''}" placeholder="$ 0"></div>
 <label class="check"><input type="checkbox" id="qNeg"> Es negativo (tarjeta de crédito / sobregiro)</label>
 <div class="acts"><button type="button" class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri">Cuadrar</button></div></form>`,()=>$('#qReal').select())}
function cuadrar(id){const c=S.cuentas.find(x=>x.id===id);let real=num($('#qReal').value);if($('#qNeg').checked)real=-real;const s=saldosCuentas()[id];c.ini=(+c.ini||0)+(real-s);cerrar();save();toast('Listo, '+c.n+' quedó en '+fmt(real))}
function cuentaUsada(id){return S.movs.some(x=>x.cuenta===id)||S.ofrendas.some(x=>x.cuenta===id)||S.transfers.some(t=>t.de===id||t.a===id)||S.deudas.some(d=>d.abonos.some(a=>a.cuenta===id))||S.metas.some(m=>m.aportes.some(a=>a.cuenta===id))||S.fijos.some(f=>f.cuenta===id)}
function borrarCuenta(id){if(S.cuentas.length<=1){toast('Debe quedar al menos una cuenta',true);return}
 const c=S.cuentas.find(x=>x.id===id),otra=S.cuentas.find(x=>x.id!==id);
 confirmar('¿Eliminar la cuenta '+c.n+'?',cuentaUsada(id)?'Sus movimientos y su saldo pasan a '+otra.n+'.':'',()=>{
  const mv=o=>{if(o.cuenta===id)o.cuenta=otra.id};S.movs.forEach(mv);S.ofrendas.forEach(mv);S.fijos.forEach(mv);S.deudas.forEach(d=>d.abonos.forEach(mv));S.metas.forEach(m=>m.aportes.forEach(mv));
  S.transfers.forEach(t=>{if(t.de===id)t.de=otra.id;if(t.a===id)t.a=otra.id});S.transfers=S.transfers.filter(t=>t.de!==t.a);
  otra.ini=(+otra.ini||0)+(+c.ini||0);S.cuentas=S.cuentas.filter(x=>x.id!==id);if(filtroCta===id)filtroCta='';save()})}

function vFijos(){
 const mh=mesDe(hoy()),pend=new Set(fijosPend(mh).map(f=>f.id));
 const gs=S.fijos.filter(f=>f.tipo==='gasto'),is=S.fijos.filter(f=>f.tipo==='ingreso');

 const tg=sum(gs.filter(act)),ti=sum(is.filter(act));
 return header('Gastos e ingresos fijos','Lo que se repite cada mes',`<button class="btn pri" onclick="formFijo()">+ Nuevo fijo</button>`)+`
 <div class="grid g3" style="margin-bottom:16px">${stat('Gastos fijos al mes','🔁','var(--out-bg)',fmt(tg),'c-out',gs.filter(act).length+' activos')}${stat('Ingresos fijos al mes','💼','var(--in-bg)',fmt(ti),'c-in',is.filter(act).length+' activos')}${stat('Te queda después de fijos','👛','var(--pri-bg)',fmt(ti-tg-ti*pct()),ti-tg-ti*pct()<0?'c-out':'c-pri','Ingresos fijos − diezmo − gastos fijos')}</div>
 ${fijosPend(mh).length?`<div class="aviso warn" style="margin-bottom:16px"><span class="ic">🔔</span><div class="tx">Tienes <b>${fijosPend(mh).length}</b> pendientes por registrar este mes</div><button class="btn sm pri" onclick="registrarTodosFijos(true)">Registrar todos</button></div>`:''}

/* ---------- PLAN DE QUINCENA ---------- */
function vQuincena(){
 const mh=mesDe(hoy());
 const ultSal=[...S.movs].filter(x=>x.tipo==='ingreso').sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
 const monto=qMonto||(ultSal?+ultSal.monto:0);
 const rango=d=>qTipo==='m'?true:qTipo==='1'?d<=15:d>15;
 const diez=Math.round(monto*pct());
 const fij=fijosPend(mh).filter(f=>f.tipo==='gasto'&&rango(+f.dia||1));
 const deu=S.deudas.filter(d=>d.tipo==='debo'&&saldoDeuda(d)>0&&+d.cuota>0&&rango(+d.dia||1)&&!pagadaEnMes(d,mh));
 const tf=sum(fij),td=sum(deu,d=>Math.min(+d.cuota,saldoDeuda(d)));
 const aho=Math.round(monto*(+S.cfg.ahorroPct||0)/100);
 const libre=monto-diez-tf-td-aho,dias=qTipo==='m'?30:15;
 const seg=[[diez,'#d4a017','🙏 Diezmo'],[tf,'#ef4444','🔁 Fijos'],[td,'#7c3aed','💳 Deudas'],[aho,'#0f766e','🐷 Ahorro'],[Math.max(0,libre),'#10b981','🛍️ Libre']];
 const L=(ic,t,s,v,cls,btn)=>`<div class="row"><div class="ico">${ic}</div><div class="info"><div class="t">${t}</div>${s?`<div class="s">${s}</div>`:''}</div><div class="amt ${cls||''}">${fmt(v)}</div>${btn||''}</div>`;
 return header('Plan de quincena','Reparte tu pago antes de gastarlo')+`
 <div class="card"><div class="frow"><div class="f"><label>¿Cuánto te pagaron?</label><input class="money" inputmode="numeric" value="${miles(monto)}" oninput="moneyIn(this)" onchange="qMonto=num(this.value);render()"></div>
 <div class="f"><label>¿Qué pago es?</label><select onchange="qTipo=this.value;render()"><option value="1" ${qTipo==='1'?'selected':''}>Primera quincena (días 1 al 15)</option><option value="2" ${qTipo==='2'?'selected':''}>Segunda quincena (días 16 al 31)</option><option value="m" ${qTipo==='m'?'selected':''}>Pago mensual (todo el mes)</option></select></div></div>
 ${monto?`<div class="stack">${seg.filter(s=>s[0]>0).map(s=>`<i style="width:${s[0]/Math.max(monto,diez+tf+td+aho)*100}%;background:${s[1]}" title="${s[2]} ${fmt(s[0])}"></i>`).join('')}</div><div class="keys mt" style="flex-wrap:wrap">${seg.filter(s=>s[0]>0).map(s=>`<span><i style="background:${s[1]}"></i>${s[2]}</span>`).join('')}</div>`:''}</div>
 ${monto?`<div class="card mt"><h3>Así lo puedes repartir</h3><div class="list">
  ${L('🙏',`Primero, el diezmo (${S.cfg.pct}%)`,'Lo de Dios va primero',diez,'c-gold',`<button class="btn sm gold" onclick="formOfrenda(null,${diez})">Entregar</button>`)}
  ${fij.map(f=>L(catIcon('gasto',f.cat),esc(f.nombre),'Gasto fijo · día '+(+f.dia||1),f.monto,'c-out',`<button class="btn sm" onclick="confirmarFijo('${f.id}')">Pagar</button>`)).join('')}
  ${deu.map(d=>L('💳','Cuota '+esc(d.nombre),'Deuda · día '+(d.dia||'—'),Math.min(+d.cuota,saldoDeuda(d)),'c-debt',`<button class="btn sm" onclick="formAbono('${d.id}')">Pagar</button>`)).join('')}
  ${L('🐷',`Ahorro (${S.cfg.ahorroPct||0}%)`,`<span style="display:inline-flex;gap:4px;align-items:center">Cambiar %: <input type="number" min="0" max="90" value="${S.cfg.ahorroPct||0}" style="width:60px;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--soft)" onchange="S.cfg.ahorroPct=Math.max(0,Math.min(90,+this.value||0));save()"></span>`,aho,'c-pri',S.metas.length?`<button class="btn sm" onclick="formAporte('${(S.metas.find(m=>ahorradoMeta(m)<m.objetivo)||S.metas[0]).id}',1,${aho})">Apartar</button>`:`<button class="btn sm" onclick="go('metas')">Crear meta</button>`)}
 </div>
 <div class="aviso ${libre<0?'out':'pri'} mt"><span class="ic">${libre<0?'⚠️':'🛍️'}</span><div class="tx">${libre<0?`<b>No alcanza:</b> te faltan ${fmt(-libre)}. Revisa qué gasto puedes mover o baja el ahorro.`:`Te quedan <b>${fmt(libre)}</b> libres para el día a día: unos <b>${fmt(libre/dias)}</b> por día durante ${dias} días.`}</div></div></div>`:'<div class="card mt"><div class="empty"><div class="big">🧮</div>Escribe cuánto te pagaron</div></div>'}
 <div class="muted sm-t mt">Toma los gastos fijos y cuotas de deudas que caen en esta quincena y que todavía no has registrado este mes.</div>`}

 <div class="muted sm-t mt">💡 La lista se queda guardada: después de registrar el gasto los productos se desmarcan para la próxima vez.</div>`}
function agregarItem(){const n=$('#iN').value.trim();if(!n)return;S.compras.push({id:uid(),n,cant:Math.max(1,+$('#iC').value||1),precio:num($('#iP').value),hecho:false});save();setTimeout(()=>$('#iN')&&$('#iN').focus(),30)}

 <div class="card mt"><h3>Tabla del año</h3><div class="scroll"><table class="tbl"><thead><tr><th>Mes</th><th class="n">Ingresos</th><th class="n">Gastos</th><th class="n">Diezmo y ofrendas</th><th class="n">Deudas pagadas</th><th class="n">Ahorro</th><th class="n">Quedó</th></tr></thead><tbody>

 ${cats.length?`<div class="card mt"><h3>Gastos del año por categoría</h3>${donut(cats,T.gas)}</div>`:''}`}

 S.cfg.ultimaCopia=new Date().toISOString();save();toast(sync?'Archivo listo 📤 Pásalo al otro equipo':'Copia descargada 💾 Guárdala en un lugar seguro')}
function exportCSV(todo){
 const rows=[['Fecha','Tipo','Categoría','Descripción','Cuenta','Valor']];
 const inM=f=>todo||mesDe(f)===mes;const cn=id=>cuentaDe(id).n;
 S.movs.filter(x=>inM(x.fecha)).forEach(x=>rows.push([x.fecha,x.tipo==='ingreso'?'Ingreso':'Gasto',x.cat,x.desc,cn(x.cuenta),x.tipo==='ingreso'?x.monto:-x.monto]));
 S.ofrendas.filter(x=>inM(x.fecha)).forEach(x=>rows.push([x.fecha,x.tipo,'Diezmo/ofrenda',[x.lugar,x.desc].filter(Boolean).join(' - '),cn(x.cuenta),-x.monto]));
 S.deudas.forEach(d=>d.abonos.filter(a=>inM(a.fecha)).forEach(a=>rows.push([a.fecha,d.tipo==='debo'?'Pago de deuda':'Abono recibido',d.nombre,a.nota,cn(a.cuenta),d.tipo==='debo'?-a.monto:a.monto])));
 S.metas.forEach(m=>m.aportes.filter(a=>inM(a.fecha)).forEach(a=>rows.push([a.fecha,a.monto>0?'Ahorro':'Retiro de ahorro',m.nombre,'',cn(a.cuenta),-a.monto])));
 S.transfers.filter(t=>inM(t.fecha)).forEach(t=>rows.push([t.fecha,'Entre cuentas',cn(t.de)+' → '+cn(t.a),t.nota,'',0]));
 const h=rows.shift();rows.sort((a,b)=>String(a[0]).localeCompare(b[0]));rows.unshift(h);
 const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='MisFinanzas-'+(todo?'todo':mes)+'.csv';document.body.appendChild(a);a.click();a.remove();toast('Archivo descargado')}

 try{const fs=await fotoTodas();for(const[id,env]of Object.entries(fs)){try{await fotoPut(id,await encStr(await decStr(env,oldKey),nk))}catch(e){}}}catch(e){}
 cryptoKey=nk;cerrar();save();toast('Contraseña cambiada 🔑')}
function borrarTodo(){confirmar('¿Borrar TODOS los datos?','Se pierde todo lo registrado. Descarga una copia antes si la necesitas.',()=>{confirmar('¿Seguro, seguro?','Esta es la última confirmación.',()=>{localStorage.removeItem(KEY);fotoBorrarTodas();S=null;cryptoKey=null;lockMode='crear';render()})},'Sí, borrar todo')}

/* ---------- combinar (sincronizar) ---------- */
function combinar(R){R=normalizar(R);const bor=new Map();[...S.borrados,...R.borrados].forEach(b=>{if(!bor.has(b.id)||bor.get(b.id)<b.t)bor.set(b.id,b.t)});
 let nuevos=0,act=0;
 COLS.forEach(k=>{const map=new Map(S[k].map(x=>[x.id,x]));R[k].forEach(x=>{const y=map.get(x.id);if(!y){if(!(bor.has(x.id)&&bor.get(x.id)>=(x.u||0))){map.set(x.id,x);nuevos++}}else if((x.u||0)>(y.u||0)){map.set(x.id,x);act++}});S[k]=[...map.values()].filter(x=>!(bor.has(x.id)&&bor.get(x.id)>=(x.u||0)))});
 S.borrados=[...bor].map(([id,t])=>({id,t}));
 if((R.cfg.u||0)>(S.cfg.u||0)){const uc=S.cfg.ultimaCopia;S.cfg=R.cfg;S.cfg.ultimaCopia=uc}
 return{nuevos,act}}
let envCombinar=null;
function elegirCombinar(){const fi=$('#fileIn');fi.value='';fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{const env=JSON.parse(await f.text());if(env.app!=='MisFinanzas'||!env.data)throw 0;envCombinar=env;
 modal(`<h2>📥 Recibir y combinar<button class="icon-btn" onclick="cerrar()">✕</button></h2><div class="muted" style="margin:-8px 0 14px">Escribe la contraseña del equipo de donde viene el archivo (si es la misma, escríbela igual).</div>
 <form onsubmit="event.preventDefault();hacerCombinar()"><div class="f"><label>Contraseña del archivo</label><input type="password" id="cbPw" required></div><div class="acts"><button type="button" class="btn" onclick="cerrar()">Cancelar</button><button class="btn pri" id="cbBtn">Combinar</button></div></form>`,()=>$('#cbPw').focus())}catch(e){toast('Ese archivo no es de Mis Finanzas',true)}};fi.click()}
async function hacerCombinar(){const env=envCombinar,btn=$('#cbBtn');btn.disabled=true;btn.textContent='Combinando...';let k,R;
 try{k=await derive($('#cbPw').value,unb64(env.salt),env.iter||ITER);R=await decrypt(env,k)}catch(e){toast('Contraseña incorrecta',true);btn.disabled=false;btn.textContent='Combinar';return}
 const r=combinar(R);
 let nf=0;try{const mias=await fotoTodas();for(const[id,fe]of Object.entries(env.fotos||{})){if(!mias[id]){try{await fotoPut(id,await encStr(await decStr(fe,k)));nf++}catch(e){}}}}catch(e){}
 S.cfg.ultimaSync=new Date().toISOString();initHashes();cerrar();save();toast(`Listo ✅ ${r.nuevos} nuevos, ${r.act} actualizados${nf?', '+nf+' fotos':''}`)}

/* ---------- modal / confirm ---------- */
function modal(html,onMount){cerrar();const bg=document.createElement('div');bg.className='modal-bg';bg.id='mbg';bg.innerHTML=`<div class="modal">${html}</div>`;bg.addEventListener('mousedown',e=>{if(e.target===bg)cerrar()});document.body.appendChild(bg);onMount&&onMount()}
function cerrar(){const m=$('#mbg');m&&m.remove()}
function confirmar(t,sub,fn,lbl){modal(`<h2>${esc(t)}</h2>${sub?`<p class="muted" style="margin:-6px 0 18px">${esc(sub)}</p>`:''}<div class="acts"><button class="btn" onclick="cerrar()">Cancelar</button><button class="btn ${lbl?'pri':'danger'}" id="okC">${esc(lbl||'Sí, eliminar')}</button></div>`);$('#okC').onclick=()=>{cerrar();fn()}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar()});

/* ---------- BLOQUEO ---------- */
let lockMode=null,restoreEnv=null;
function renderLock(){
 if(!lockMode)lockMode=localStorage.getItem(KEY)?'entrar':'crear';
 const m=lockMode;
 $('#root').innerHTML=`<div class="lock"><div class="box"><div class="logo">💰</div>
 <h1>${m==='crear'?'Bienvenido a Mis Finanzas':m==='restaurar'?'Restaurar copia':'Mis Finanzas'}</h1>
 <p>${m==='crear'?'Crea una contraseña para proteger tus datos.':m==='restaurar'?'Escribe la contraseña con la que se hizo esa copia.':'Escribe tu contraseña para entrar.'}</p>
 <form onsubmit="event.preventDefault();entrar()">
  ${m==='crear'?`<div class="f"><label>¿Cómo te llamas?</label><input id="lNombre" maxlength="40" placeholder="Tu nombre"></div>`:''}
  <div class="f"><label>Contraseña</label><input type="password" id="lPw" required autocomplete="${m==='crear'?'new-password':'current-password'}" ${m==='crear'?'minlength="4"':''}></div>
  ${m==='crear'?`<div class="f"><label>Repite la contraseña</label><input type="password" id="lPw2" required></div><div class="muted" style="font-size:12.5px;margin-bottom:12px">⚠️ Si olvidas la contraseña no hay forma de recuperar los datos. Anótala en un lugar seguro.</div>`:''}
  <div class="err" id="lErr"></div>
  <button class="btn pri" id="lBtn">${m==='crear'?'Crear y empezar':m==='restaurar'?'Restaurar':'Entrar'}</button>
 </form>
 <div style="text-align:center;margin-top:16px;font-size:13.5px">${m==='restaurar'?`<button class="link" onclick="lockMode=null;restoreEnv=null;render()">Cancelar</button>`:`<button class="link" onclick="elegirCopia()">Restaurar desde una copia</button>`}</div>
 </div></div>`;
 setTimeout(()=>{const e=$('#lNombre')||$('#lPw');e&&e.focus()},50);
}
async function entrar(){
 const pw=$('#lPw').value,err=$('#lErr'),btn=$('#lBtn');err.textContent='';
 if(lockMode==='crear'){if(pw.length<4){err.textContent='Mínimo 4 caracteres';return}if(pw!==$('#lPw2').value){err.textContent='Las contraseñas no coinciden';return}
  btn.disabled=true;btn.textContent='Preparando...';salt=crypto.getRandomValues(new Uint8Array(16));curIter=ITER;cryptoKey=await derive(pw,salt,curIter);S=nuevoEstado($('#lNombre').value.trim());initHashes();lockMode=null;view='inicio';save();resetIdle();return}
 const env=lockMode==='restaurar'?restoreEnv:JSON.parse(localStorage.getItem(KEY));
 btn.disabled=true;btn.textContent='Abriendo...';
 try{const sl=unb64(env.salt),it=env.iter||ITER,k=await derive(pw,sl,it);const d=await decrypt(env,k);
  cryptoKey=k;salt=sl;curIter=it;S=normalizar(d);initHashes();
  if(lockMode==='restaurar'){const{fotos,...rest}=env;localStorage.setItem(KEY,JSON.stringify(rest));await fotoBorrarTodas();for(const[id,fe]of Object.entries(fotos||{})){try{await fotoPut(id,fe)}catch(e){}}toast('Copia restaurada ✅')}
  lockMode=null;restoreEnv=null;view='inicio';mes=mesDe(hoy());render();resetIdle();setTimeout(mostrarAvisos,300);
 }catch(e){err.textContent='Contraseña incorrecta';btn.disabled=false;btn.textContent=lockMode==='restaurar'?'Restaurar':'Entrar';$('#lPw').select()}
}
function elegirCopia(){const fi=$('#fileIn');fi.value='';fi.onchange=async()=>{const f=fi.files[0];if(!f)return;try{const env=JSON.parse(await f.text());if(env.app!=='MisFinanzas'||!env.data)throw 0;
 if(localStorage.getItem(KEY)&&!confirm('Esto reemplazará los datos que tienes ahora en este equipo por los de la copia. ¿Continuar?'))return;
 await saving;restoreEnv=env;lockMode='restaurar';S=null;cryptoKey=null;cerrar();render()}catch(e){toast('Ese archivo no es una copia de Mis Finanzas',true)}};fi.click()}
function bloquear(){saving.then(()=>{S=null;cryptoKey=null;lockMode=null;cerrar();render()})}
let idleT;function resetIdle(){clearTimeout(idleT);if(S)idleT=setTimeout(bloquear,15*60*1000)}
['mousemove','keydown','click','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));

render();
/* Cuando se abre desde internet (iPhone / celular): instalable y funciona sin conexión */
if(location.protocol.startsWith('http')){
 const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
